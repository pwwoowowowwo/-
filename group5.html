<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الشفتات - المجموعة الخامسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; --text-main: #f8fafc; --text-muted: #94a3b8;
            --morning-grad: linear-gradient(135deg, #0284c7, #38bdf8);
            --afternoon-grad: linear-gradient(135deg, #d97706, #fbbf24);
            --night-grad: linear-gradient(135deg, #4338ca, #6366f1);
            --off-grad: linear-gradient(135deg, #059669, #34d399);
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: all 0.3s ease; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b); color: var(--text-main); padding: 20px 10px; direction: rtl; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; width: 100%; }
        .glass-card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn, .print-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #38bdf8; padding: 8px 16px; border-radius: 12px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .back-btn:hover, .print-btn:hover { background: rgba(56, 189, 248, 0.2); }
        .hero-card { color: white; text-align: center; padding: 24px 18px; border-radius: 24px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
        .hero-card .date-badge { background: rgba(0, 0, 0, 0.3); padding: 6px 18px; border-radius: 50px; display: inline-block; font-size: 0.9rem; margin-bottom: 10px; font-weight: 700; }
        .hero-card .shift-title { font-size: 2.1rem; font-weight: 800; margin: 6px 0; }
        .hero-card .shift-subtitle { font-size: 1.15rem; font-weight: 700; }
        .card-title { font-size: 1.1rem; font-weight: 700; color: #38bdf8; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.88rem; font-weight: 700; color: #e2e8f0; }
        input[type="date"] { padding: 11px 14px; border: 1.5px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font-size: 0.95rem; outline: none; background: rgba(15, 23, 42, 0.6); color: #ffffff; font-weight: 600; width: 100%; }
        .btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 12px 18px; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; width: 100%; margin-top: 14px; }
        .query-result-card { display: none; margin-top: 14px; padding: 16px; border-radius: 16px; text-align: center; color: white; font-weight: 700; }
        .month-section { margin-bottom: 25px; }
        .month-header { background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 10px 15px; border-radius: 10px; font-weight: 800; font-size: 1rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(56, 189, 248, 0.3); }
        .print-watermark-header { display: none; font-size: 0.8rem; color: #000; font-weight: bold; margin-bottom: 5px; text-align: center; }
        .table-container { max-height: 480px; overflow-y: auto; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(15, 23, 42, 0.4); }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { border: 1px solid #cbd5e1; padding: 10px 8px; }
        th { position: sticky; top: 0; background: #0f172a; color: #38bdf8; font-size: 0.85rem; font-weight: 800; z-index: 5; }
        td { font-size: 0.88rem; color: #cbd5e1; }
        .hijri-text { color: #38bdf8; font-size: 0.85rem; font-weight: 700; }
        .pill { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; color: white; display: inline-flex; align-items: center; gap: 6px; }
        footer { margin-top: 30px; background: rgba(15, 23, 42, 0.9); color: #94a3b8; padding: 18px 15px; border-radius: 16px; text-align: center; border-top: 2px solid #38bdf8; }
        footer .designer { color: #38bdf8; font-weight: 800; }
        .bg-morning { background: var(--morning-grad) !important; }
        .bg-afternoon { background: var(--afternoon-grad) !important; }
        .bg-night { background: var(--night-grad) !important; }
        .bg-off { background: var(--off-grad) !important; }
        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            @page { size: A4; margin: 10mm; }
            .glass-card, .container { box-shadow: none !important; border: none !important; background: white !important; width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .nav-bar, .print-btn, .back-btn, .grid-form, .btn, footer, #queryResultCard, .hero-card { display: none !important; }
            .print-watermark-header { display: block !important; }
            .table-container { max-height: none !important; overflow: visible !important; border: 1px solid #000 !important; background: white !important; }
            table { page-break-inside: auto; }
            tr { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; }
            th { background: #f1f5f9 !important; color: #000 !important; border: 1px solid #000 !important; }
            td { color: #000 !important; border: 1px solid #000 !important; }
            .hijri-text { color: #000 !important; }
            .month-section { page-break-before: auto; margin-bottom: 20px; }
            .month-header { background: #e2e8f0 !important; color: #000 !important; border: 1px solid #000 !important; }
            .pill { background: none !important; color: #000 !important; border: 1px solid #000 !important; padding: 2px 5px !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للرئيسية</a>
            <button class="print-btn" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الجدول</button>
            <div style="font-weight: 700; color: #38bdf8; font-size: 1.1rem;">إدارة شفتات: المجموعة الخامسة</div>
        </div>
        <div id="heroCard" class="hero-card bg-morning">
            <div id="liveDateBadge" class="date-badge">جاري الحساب...</div>
            <div style="font-size: 0.9rem; opacity: 0.9;">حالتك اليوم:</div>
            <div id="liveShiftTitle" class="shift-title">---</div>
            <div id="liveShiftSub" class="shift-subtitle">---</div>
        </div>
        <div class="glass-card">
            <div class="card-title"><span><i class="fa-solid fa-magnifying-glass"></i> استعلام عن تاريخ محدد</span></div>
            <div class="grid-form">
                <div class="form-group">
                    <label for="queryDate">التاريخ الميلادي:</label>
                    <input type="date" id="queryDate" onchange="querySpecificDate()">
                </div>
            </div>
            <button class="btn" onclick="querySpecificDate()"><i class="fa-solid fa-search"></i> استعلام</button>
            <div id="queryResultCard" class="query-result-card"></div>
        </div>
        <div class="glass-card">
            <div class="card-title">
                <span><i class="fa-solid fa-calendar-days"></i> جدول الشفتات (6 شهور قادمة)</span>
                <span style="font-size: 0.85rem; color: var(--text-muted);">جميع الحقوق محفوظة © 2026 | تصميم أبو مرزوق</span>
            </div>
            <div id="groupedTablesContainer"></div>
        </div>
        <footer>
            <p>جميع الحقوق محفوظة © 2026 | تصميم <span class="designer">أبو مرزوق</span></p>
        </footer>
    </div>
    <script>
        const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const ordinalNames = ['', 'اليوم الأول', 'اليوم الثاني', 'اليوم الثالث', 'اليوم الرابع', 'اليوم الخامس'];
        const groupStartDate = '2026-07-31';

        function getHijriDetails(dateObj) {
            const formatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' });
            return formatter.format(dateObj);
        }
        function getHijriMonthName(dateObj) {
            const formatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { month: 'long', year: 'numeric' });
            return formatter.format(dateObj);
        }
        function getShiftInfo(dayIndex) {
            const cycleDay = ((dayIndex % 25) + 25) % 25; 
            if (cycleDay < 5) return { title: 'شفت صباح 🌅', sub: ordinalNames[cycleDay + 1], bgClass: 'bg-morning', icon: 'fa-sun' };
            if (cycleDay < 8) return { title: 'راحة / أوف 🌿', sub: ordinalNames[cycleDay - 4], bgClass: 'bg-off', icon: 'fa-mug-hot' };
            if (cycleDay < 13) return { title: 'شفت ظهر ☀️', sub: ordinalNames[cycleDay - 7], bgClass: 'bg-afternoon', icon: 'fa-cloud-sun' };
            if (cycleDay < 16) return { title: 'راحة / أوف 🌿', sub: ordinalNames[cycleDay - 12], bgClass: 'bg-off', icon: 'fa-mug-hot' };
            if (cycleDay < 21) return { title: 'شفت ليل 🌙', sub: ordinalNames[cycleDay - 15], bgClass: 'bg-night', icon: 'fa-moon' };
            return { title: 'راحة / أوف 🌿', sub: ordinalNames[cycleDay - 20], bgClass: 'bg-off', icon: 'fa-bed' };
        }
        window.onload = function() {
            document.getElementById('queryDate').value = new Date().toISOString().split('T')[0];
            loadGroupData();
        };
        function loadGroupData() {
            const startParts = groupStartDate.split('-');
            const startDate = new Date(startParts[0], startParts[1] - 1, startParts[2]);
            const today = new Date();
            const todayClean = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const diffDays = Math.floor((todayClean - startDate) / (1000 * 60 * 60 * 24));
            const currentInfo = getShiftInfo(diffDays);
            document.getElementById('heroCard').className = `hero-card ${currentInfo.bgClass}`;
            document.getElementById('liveDateBadge').innerText = `${daysOfWeek[today.getDay()]}، ${today.toISOString().split('T')[0]} م (${getHijriDetails(today)})`;
            document.getElementById('liveShiftTitle').innerText = currentInfo.title;
            document.getElementById('liveShiftSub').innerText = currentInfo.sub;

            const container = document.getElementById('groupedTablesContainer');
            container.innerHTML = '';
            let monthsMap = {};
            for (let i = 0; i < 180; i++) {
                const d = new Date(startDate);
                d.setDate(startDate.getDate() + i);
                const info = getShiftInfo(i);
                const hijriMonthStr = getHijriMonthName(d);
                if (!monthsMap[hijriMonthStr]) monthsMap[hijriMonthStr] = [];
                monthsMap[hijriMonthStr].push({ d, info });
            }
            for (let monthName in monthsMap) {
                let section = document.createElement('div');
                section.className = 'month-section';
                let headerHtml = `
                    <div class="print-watermark-header">جميع الحقوق محفوظة © 2026 | تصميم أبو مرزوق - نظام متابعة الشفتات</div>
                    <div class="month-header"><span><i class="fa-solid fa-calendar"></i> الشهر الهجري: ${monthName}</span></div>
                `;
                let tableHtml = `<div class="table-container"><table><thead><tr><th>اليوم</th><th>الميلادي</th><th>الهجري</th><th>حالة الدوام / الشفت</th></tr></thead><tbody>`;
                monthsMap[monthName].forEach(item => {
                    let d = item.d;
                    let info = item.info;
                    tableHtml += `<tr><td>${daysOfWeek[d.getDay()]}</td><td>${d.toISOString().split('T')[0]}</td><td class="hijri-text">${getHijriDetails(d)}</td><td><span class="pill ${info.bgClass}"><i class="fa-solid ${info.icon}"></i> ${info.title} (${info.sub})</span></td></tr>`;
                });
                tableHtml += `</tbody></table></div>`;
                section.innerHTML = headerHtml + tableHtml;
                container.appendChild(section);
            }
            querySpecificDate();
        }
        function querySpecificDate() {
            const startParts = groupStartDate.split('-');
            const queryInput = document.getElementById('queryDate').value;
            if (!queryInput) return;
            const qParts = queryInput.split('-');
            const queryDate = new Date(Date.UTC(qParts[0], qParts[1] - 1, qParts[2]));
            const diffDays = Math.floor((queryDate - new Date(Date.UTC(startParts[0], startParts[1]-1, startParts[2]))) / (1000 * 60 * 60 * 24));
            const info = getShiftInfo(diffDays);
            const localQueryDate = new Date(qParts[0], qParts[1] - 1, qParts[2]);
            const res = document.getElementById('queryResultCard');
            res.style.display = 'block';
            res.className = `query-result-card ${info.bgClass}`;
            res.innerHTML = `تاريخ الاستعلام: ${queryInput} (${getHijriDetails(localQueryDate)})<br><span style="font-size:1.3rem;">${info.title} (${info.sub})</span>`;
        }
    </script>
</body>
</html>
