<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام متابعة الشفتات - المجموعة الخامسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --primary-bg: #f8fafc; --card-bg: #ffffff; --accent: #1e3a8a; --accent-light: #dbeafe; --text-main: #0f172a; --text-sub: #64748b; --border: #cbd5e1; --shadow: rgba(0, 0, 0, 0.04);
            --morning-bg: #fff7ed; --morning-border: #fdba74; --morning-text: #c2410c; --morning-box: #ffedd5;
            --afternoon-bg: #fefce8; --afternoon-border: #fde047; --afternoon-text: #854d0e; --afternoon-box: #fef08a;
            --night-bg: #0f172a; --night-border: #3b82f6; --night-text: #f8fafc; --night-box: #1e293b;
            --off-bg: #f0fdf4; --off-border: #86efac; --off-text: #15803d; --off-box: #dcfce7;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; min-width: 0; }
        body { background: var(--primary-bg); color: var(--text-main); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; direction: rtl; }
        
        /* الحاوية متجاوبة تلقائياً مع الشاشات الكبيرة والصغيرة (تتوسع براحة لتناسب التابلت والكمبيوتر والجوال) */
        .container { width: 100%; max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
        
        /* شاشة التحميل الترحيبية (3 ثوانٍ) */
        #welcomeOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: #ffffff; text-align: center; padding: 20px;
            transition: opacity 0.5s ease;
        }
        .loader-box { background: var(--card-bg); color: var(--text-main); padding: 30px 24px; border-radius: 20px; width: 100%; max-width: 340px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--border); }
        .loader-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; animation: bounce 1.5s infinite; }
        .loader-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 8px; color: var(--text-main); }
        .loader-sub { font-size: 0.82rem; font-weight: 700; color: var(--text-sub); margin-bottom: 20px; }
        .progress-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.1s linear; }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .welcome-header-bar { background: linear-gradient(135deg, #1e3a8a, #1e40af); color: #ffffff; border-radius: 14px; padding: 12px 18px; font-size: 0.95rem; font-weight: 800; text-align: center; box-shadow: 0 2px 8px var(--shadow); }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--accent); padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 1px 4px var(--shadow); }
        .nav-title-box { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; box-shadow: 0 1px 4px var(--shadow); }
        
        .ios-calendar-card, .ios-widget-card, .glass-card { background: #ffffff; border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: 0 2px 8px var(--shadow); width: 100%; overflow: hidden; }
        .ios-cal-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 800; color: var(--text-sub); margin-bottom: 10px; }
        .ios-week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
        .ios-day-item { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.2s; }
        .ios-day-item.active { background: var(--accent); color: #ffffff; border-color: var(--accent); }
        .ios-day-name { font-size: 0.72rem; font-weight: 700; margin-bottom: 3px; }
        .ios-day-num { font-size: 1rem; font-weight: 900; }
        
        /* كرت الحالة المدمج والممركز والأنيق */
        .ios-widget-card { border-radius: 18px; padding: 20px; border: 1.5px solid var(--border); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; }
        .ios-widget-top { display: flex; align-items: center; justify-content: center; width: 100%; }
        .ios-widget-badge { background: rgba(255, 255, 255, 0.9); padding: 5px 14px; border-radius: 50px; font-size: 0.8rem; font-weight: 800; border: 1px solid rgba(0,0,0,0.05); }
        .ios-widget-body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .ios-widget-icon-box { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.05); }
        .ios-widget-title { font-size: 1.25rem; font-weight: 900; line-height: 1.3; }
        .ios-widget-sub-box { padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; display: inline-block; background: rgba(255,255,255,0.6); }
        
        .ios-theme-morning { background: linear-gradient(135deg, var(--morning-bg), #ffffff); border-color: var(--morning-border); color: var(--morning-text); }
        .ios-theme-morning .ios-widget-icon-box { background: var(--morning-box); border-color: var(--morning-border); }
        .ios-theme-afternoon { background: linear-gradient(135deg, var(--afternoon-bg), #ffffff); border-color: var(--afternoon-border); color: var(--afternoon-text); }
        .ios-theme-afternoon .ios-widget-icon-box { background: var(--afternoon-box); border-color: var(--afternoon-border); }
        .ios-theme-night { background: linear-gradient(135deg, #0f172a, #1e293b); border-color: var(--night-border); color: var(--night-text); }
        .ios-theme-night .ios-widget-icon-box { background: #1e293b; border-color: var(--night-border); color: #60a5fa; }
        .ios-theme-off { background: linear-gradient(135deg, var(--off-bg), #ffffff); border-color: var(--off-border); color: var(--off-text); }
        .ios-theme-off .ios-widget-icon-box { background: var(--off-box); border-color: var(--off-border); }
        
        .card-title-box { background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        input[type="date"] { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; background: #f8fafc; font-weight: 700; width: 100%; display: block; }
        .btn { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; border: none; padding: 11px; border-radius: 10px; font-size: 0.9rem; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 2px 4px var(--shadow); }
        .query-result-card { display: none; margin-top: 10px; padding: 10px; border-radius: 12px; text-align: center; font-weight: 800; font-size: 0.85rem; width: 100%; border: 1px solid rgba(0,0,0,0.05); }
        
        /* صندوق السكرول للجداول وتنسيق الطباعة التلقائية */
        .table-scroll-box { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; background: #fff; margin-bottom: 10px; }
        .month-header-box { background: var(--accent-light); color: var(--accent); padding: 8px 14px; font-weight: 800; font-size: 0.85rem; position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        
        .print-watermark-rights { display: none; font-size: 0.8rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
        
        .mobile-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .mobile-table th, .mobile-table td { padding: 9px 8px; font-size: 0.82rem; text-align: center; border: 1px solid var(--border); word-break: break-word; }
        .mobile-table th { background: #f1f5f9; color: #334155; position: sticky; top: 37px; z-index: 1; font-weight: 800; }
        .hijri-sub { font-size: 0.7rem; color: var(--accent); font-weight: 700; }
        .pill-compact { padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
        
        footer { margin-top: 12px; text-align: center; font-size: 0.8rem; color: var(--text-sub); padding: 8px; }
        .designer { color: var(--accent); font-weight: 800; }

        /* إعدادات الطباعة المخصصة: طباعة جداول الشفتات فقط مع الحقوق أعلى كل جدول */
        @media print {
            body * { visibility: hidden; }
            #printableTablesArea, #printableTablesArea * { visibility: visible; }
            #printableTablesArea { position: absolute; top: 0; left: 0; width: 100%; padding: 0; margin: 0; background: white; }
            .table-scroll-box { max-height: none !important; overflow: visible !important; border: 2px solid #000 !important; page-break-inside: avoid; margin-bottom: 20px; border-radius: 0 !important; }
            .print-watermark-rights { display: block !important; }
            .month-header-box { position: static !important; background: #e2e8f0 !important; color: #000 !important; border-bottom: 2px solid #000 !important; }
            .mobile-table th { position: static !important; background: #f1f5f9 !important; border: 1px solid #000 !important; color: #000 !important; }
            .mobile-table td { border: 1px solid #000 !important; color: #000 !important; }
            .pill-compact { border: 1px solid #000 !important; background: transparent !important; color: #000 !important; }
            .hijri-sub { color: #333 !important; }
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل الترحيبية (3 ثوانٍ) -->
    <div id="welcomeOverlay">
        <div class="loader-box">
            <div class="loader-icon"><i class="fa-solid fa-layer-group"></i></div>
            <div class="loader-title">أهلاً بك في نظام حاسبة الشفتات</div>
            <div class="loader-sub" id="loaderText">جاري تحميل الجدول...</div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="welcome-header-bar"><i class="fa-solid fa-sparkles"></i> أهلاً بك في نظام حاسبة الشفتات - المجموعة الخامسة</div>
        
        <div class="nav-bar">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> الرئيسية</a>
            <div class="nav-title-box"><i class="fa-solid fa-layer-group"></i> المجموعة الخامسة</div>
        </div>
        
        <div class="ios-calendar-card">
            <div class="ios-cal-header"><span>الأسبوع الحالي</span><span id="iosMonthName">---</span></div>
            <div class="ios-week-days" id="iosWeekContainer"></div>
        </div>
        
        <!-- كرت الحالة المدمج والممركز والأنيق -->
        <div id="heroCard" class="ios-widget-card ios-theme-morning">
            <div class="ios-widget-top"><div id="liveDateBadge" class="ios-widget-badge">جاري الحساب...</div></div>
            <div class="ios-widget-body">
                <div id="liveShiftIconBox" class="ios-widget-icon-box"><i class="fa-solid fa-sun"></i></div>
                <div id="liveShiftTitle" class="ios-widget-title">---</div>
                <div id="liveShiftSub" class="ios-widget-sub-box">---</div>
            </div>
        </div>
        
        <div class="glass-card">
            <div class="card-title-box">استعلام عن تاريخ</div>
            <input type="date" id="queryDate" onchange="querySpecificDate()">
            <button class="btn" onclick="querySpecificDate()">استعلام</button>
            <div id="queryResultCard" class="query-result-card"></div>
        </div>
        
        <div class="glass-card">
            <div class="card-title-box">
                <span>جدول الشفتات القادمة</span>
                <span style="font-size: 0.75rem; color: var(--text-sub);">اسحب للأسفل لعرض الشهور</span>
            </div>
            <!-- حاوية مخصصة لطباعة جداول الشفتات فقط مع الحقوق -->
            <div id="printableTablesArea"></div>
        </div>
        
        <footer>جميع الحقوق محفوظة © 2026 | تصميم <span class="designer">أبو مرزوق</span></footer>
    </div>

    <script>
        const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const ordinalNames = ['', 'اليوم 1', 'اليوم 2', 'اليوم 3', 'اليوم 4', 'اليوم 5'];
        const groupStartDate = '2026-07-31';

        // عداد 3 ثوانٍ دقيق دون زر تخطي
        function initLoader() {
            const totalTime = 3000; // 3 ثوانٍ بالضبط
            const intervalTime = 50;
            let elapsed = 0;
            const fill = document.getElementById('progressFill');
            
            const timer = setInterval(() => {
                elapsed += intervalTime;
                let percent = (elapsed / totalTime) * 100;
                if (percent >= 100) {
                    percent = 100;
                    clearInterval(timer);
                    dismissLoader();
                }
                fill.style.width = percent + '%';
            }, intervalTime);
        }

        function dismissLoader() {
            const overlay = document.getElementById('welcomeOverlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 500);
            }
        }

        function getHijriDetails(d) { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day: 'numeric', month: 'long' }).format(d); }
        function getHijriMonthName(d) { return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { month: 'long', year: 'numeric' }).format(d); }
        
        function getShiftInfo(dayIndex) {
            const cycleDay = ((dayIndex % 25) + 25) % 25; 
            if (cycleDay < 5) return { title: 'شفت صباح', sub: ordinalNames[cycleDay + 1], themeClass: 'ios-theme-morning', icon: 'fa-cloud-sun' };
            if (cycleDay < 8) return { title: 'راحة / أوف', sub: ordinalNames[cycleDay - 4], themeClass: 'ios-theme-off', icon: 'fa-mug-hot' };
            if (cycleDay < 13) return { title: 'شفت ظهر', sub: ordinalNames[cycleDay - 7], themeClass: 'ios-theme-afternoon', icon: 'fa-sun' };
            if (cycleDay < 16) return { title: 'راحة / أوف', sub: ordinalNames[cycleDay - 12], themeClass: 'ios-theme-off', icon: 'fa-mug-hot' };
            if (cycleDay < 21) return { title: 'شفت ليل', sub: ordinalNames[cycleDay - 15], themeClass: 'ios-theme-night', icon: 'fa-moon' };
            return { title: 'راحة / أوف', sub: ordinalNames[cycleDay - 20], themeClass: 'ios-theme-off', icon: 'fa-bed' };
        }

        function renderIOSCalendar(today, selectedDate = null) {
            const container = document.getElementById('iosWeekContainer');
            container.innerHTML = '';
            document.getElementById('iosMonthName').innerText = new Intl.DateTimeFormat('ar-SA', { month: 'long', year: 'numeric' }).format(today);
            const activeDate = selectedDate || today;
            const sunday = new Date(today); sunday.setDate(today.getDate() - today.getDay());
            for (let i = 0; i < 7; i++) {
                const d = new Date(sunday); d.setDate(sunday.getDate() + i);
                const dayItem = document.createElement('div');
                dayItem.className = `ios-day-item ${d.toDateString() === activeDate.toDateString() ? 'active' : ''}`;
                dayItem.innerHTML = `<span class="ios-day-name">${daysOfWeek[d.getDay()]}</span><span class="ios-day-num">${d.getDate()}</span>`;
                dayItem.onclick = () => { updateWidgetForDate(d); renderIOSCalendar(today, d); };
                container.appendChild(dayItem);
            }
        }

        function updateWidgetForDate(targetDate) {
            const startParts = groupStartDate.split('-');
            const startDate = new Date(startParts[0], startParts[1] - 1, startParts[2]);
            const targetClean = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            const diffDays = Math.floor((targetClean - startDate) / (1000 * 60 * 60 * 24));
            const info = getShiftInfo(diffDays);
            document.getElementById('heroCard').className = `ios-widget-card ${info.themeClass}`;
            document.getElementById('liveDateBadge').innerText = `${daysOfWeek[targetClean.getDay()]} ${targetClean.toISOString().split('T')[0]}`;
            document.getElementById('liveShiftIconBox').innerHTML = `<i class="fa-solid ${info.icon}"></i>`;
            document.getElementById('liveShiftTitle').innerText = info.title;
            document.getElementById('liveShiftSub').innerText = info.sub;
        }

        window.onload = () => { 
            initLoader();
            document.getElementById('queryDate').value = new Date().toISOString().split('T')[0]; 
            loadGroupData(); 
        };

        function loadGroupData() {
            const startParts = groupStartDate.split('-');
            const startDate = new Date(startParts[0], startParts[1] - 1, startParts[2]);
            const todayClean = new Date(); todayClean.setHours(0,0,0,0);
            renderIOSCalendar(todayClean); updateWidgetForDate(todayClean);
            
            const container = document.getElementById('printableTablesArea'); 
            container.innerHTML = '';
            let monthsMap = {};
            
            for (let i = 0; i < 180; i++) {
                const d = new Date(todayClean); d.setDate(todayClean.getDate() + i);
                const info = getShiftInfo(Math.floor((d - startDate) / (1000 * 60 * 60 * 24)));
                const mName = getHijriMonthName(d);
                if (!monthsMap[mName]) monthsMap[mName] = [];
                monthsMap[mName].push({ d, info });
            }
            
            for (let mName in monthsMap) {
                let scrollBox = document.createElement('div');
                scrollBox.className = 'table-scroll-box';
                
                let tHtml = `<div class="print-watermark-rights">نظام متابعة الشفتات - المجموعة الخامسة | تصميم أبو مرزوق © 2026</div>`;
                tHtml += `<div class="month-header-box"><span>${mName}</span><span style="font-size:0.75rem; font-weight:normal;">المجموعة الخامسة</span></div>`;
                tHtml += `<table class="mobile-table"><thead><tr><th>اليوم</th><th>التاريخ</th><th>الدوام</th></tr></thead><tbody>`;
                
                monthsMap[mName].forEach(item => {
                    tHtml += `<tr><td><b>${daysOfWeek[item.d.getDay()]}</b></td><td><span>${item.d.toISOString().split('T')[0].substring(5)}</span><br><span class="hijri-sub">${getHijriDetails(item.d)}</span></td><td><span class="pill-compact ${item.info.themeClass}"><i class="fa-solid ${item.info.icon}"></i> ${item.info.title}</span></td></tr>`;
                });
                
                scrollBox.innerHTML = tHtml + `</tbody></table>`; 
                container.appendChild(scrollBox);
            }
            querySpecificDate();
        }

        function querySpecificDate() {
            const startParts = groupStartDate.split('-');
            const q = document.getElementById('queryDate').value; if (!q) return;
            const qParts = q.split('-');
            const diff = Math.floor((new Date(Date.UTC(qParts[0], qParts[1] - 1, qParts[2])) - new Date(Date.UTC(startParts[0], startParts[1]-1, startParts[2]))) / (1000 * 60 * 60 * 24));
            const info = getShiftInfo(diff);
            const res = document.getElementById('queryResultCard'); res.style.display = 'block'; res.className = `query-result-card ${info.themeClass}`;
            res.innerHTML = `<div>${q}</div><div style="margin-top:4px;"><i class="fa-solid ${info.icon}"></i> ${info.title} (${info.sub})</div>`;
        }
    </script>
</body>
</html>
