<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الشفتات - 5 مجموعات</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0f172a;
            --bg: #0b132b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --morning-grad: linear-gradient(135deg, #0284c7, #38bdf8);
            --afternoon-grad: linear-gradient(135deg, #d97706, #fbbf24);
            --night-grad: linear-gradient(135deg, #4338ca, #6366f1);
            --off-grad: linear-gradient(135deg, #059669, #34d399);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: var(--text-main);
            padding: 20px 10px 0 10px;
            direction: rtl;
            min-height: 100vh;
        }

        body.splash-active {
            overflow: hidden;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-content {
            text-align: center;
            color: #ffffff;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-animated {
            font-size: 3.5rem;
            margin-bottom: 12px;
            display: inline-block;
            color: #38bdf8;
            animation: pulse 1.5s infinite alternate ease-in-out;
        }

        .welcome-text {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .loader-bar {
            width: 220px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            margin: 22px auto 0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar::after {
            content: '';
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            animation: loading 1.8s ease-in-out infinite;
        }

        .fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            opacity: 0;
        }

        .container.visible {
            opacity: 1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.85rem;
            color: #ffffff;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .system-desc-box {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 14px;
            display: inline-block;
            font-size: 0.95rem;
            font-weight: 800;
            border: 2px solid #38bdf8;
        }

        .today-status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .status-box {
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .status-box .group-tag {
            font-size: 1.15rem;
            font-weight: 800;
            display: block;
            margin-bottom: 4px;
        }

        .status-box .sub-tag {
            font-size: 0.8rem;
            opacity: 0.9;
            font-weight: 700;
            margin-top: 2px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        input[type="date"], select {
            padding: 11px 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-weight: 600;
        }

        select option {
            background: #0f172a;
            color: #ffffff;
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #475569, #334155);
            box-shadow: 0 4px 15px rgba(51, 65, 85, 0.4);
        }

        .table-container {
            max-height: 520px;
            overflow: auto;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.85rem;
        }

        th, td {
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 5px;
        }

        th {
            position: sticky;
            top: 0;
            background: #0f172a;
            color: #38bdf8;
            font-weight: 800;
            z-index: 10;
        }

        .pill {
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: white;
            display: inline-block;
            white-space: nowrap;
        }

        footer {
            margin-top: 30px;
            background: rgba(15, 23, 42, 0.9);
            color: #94a3b8;
            padding: 22px 15px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            text-align: center;
            border-top: 2px solid #38bdf8;
        }

        footer .designer {
            color: #38bdf8;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .bg-morning { background: var(--morning-grad) !important; }
        .bg-afternoon { background: var(--afternoon-grad) !important; }
        .bg-night { background: var(--night-grad) !important; }
        .bg-off { background: var(--off-grad) !important; }

        @keyframes zoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
        @keyframes loading { 0% { left: -100%; } 100% { left: 100%; } }

        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            #splash-screen, .header, .glass-card:not(.schedule-page-card), footer { display: none !important; }
            .schedule-page-card { background: white !important; border: none !important; box-shadow: none !important; page-break-after: always; }
            .table-container { max-height: none !important; overflow: visible !important; }
            th { background: #0f172a !important; color: white !important; -webkit-print-color-adjust: exact; }
            td { color: black !important; }
            .pill { -webkit-print-color-adjust: exact; border: 1px solid #666; }
        }
    </style>
</head>
<body class="splash-active">

<div id="splash-screen">
    <div class="splash-content">
        <div class="logo-animated"><i class="fa-solid fa-users-gear"></i></div>
        <h1 class="welcome-text">جدول المجموعات الشهري </h1>
        <div class="loader-bar"></div>
    </div>
</div>

<div id="mainContainer" class="container">

    <div class="header">
        <h1><i class="fa-solid fa-calendar-days" style="color: #38bdf8;"></i> جدول الشفتات الذكي (دورة 25 يوماً)</h1>
        <div class="system-desc-box">
            <i class="fa-solid fa-shield-halved"></i> ترتيب العرض المعتمد: (الاولى - الثانية - الثالثة - الرابعة - الخامسة)
        </div>
    </div>

    <!-- لوحة حالة اليوم المباشرة -->
    <div class="glass-card">
        <div class="card-title"><i class="fa-solid fa-clock"></i> حالة الشفتات لليوم الحالي: <span id="todayDateLabel" style="color: #fff; font-size: 0.95rem;"></span></div>
        <div id="todayStatusGrid" class="today-status-grid"></div>
    </div>

    <!-- التحكم والإعدادات -->
    <div class="glass-card">
        <div class="card-title"><i class="fa-solid fa-sliders"></i> ضبط الدورة والتصفية</div>
        <div class="grid-form">
            <div class="form-group">
                <label for="startDate">بداية الدورة (أول يوم صباح للمجموعة الأولى):</label>
                <input type="date" id="startDate" onchange="saveAndCalculate()">
            </div>
            <div class="form-group">
                <label for="groupFilter">عرض جدول مجموعة محددة:</label>
                <select id="groupFilter" onchange="calculateAll()">
                    <option value="ALL">عرض جميع المجموعات (جدول شامل)</option>
                    <option value="0">المجموعة ( الاولى )</option>
                    <option value="4">المجموعة ( الثانية )</option>
                    <option value="3">المجموعة ( الثالثة )</option>
                    <option value="2">المجموعة ( الرابعة )</option>
                    <option value="1">المجموعة ( الخامسة )</option>
                </select>
            </div>
        </div>
    </div>

    <!-- حاوية جداول الشفتات -->
    <div id="tablesWrapper"></div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 | تصميم <span class="designer">أبو مرزوق</span></p>
    </footer>

</div>

<script>
    const daysOfWeek = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
    const ordinalNames = ['', 'اليوم الأول', 'اليوم الثاني', 'اليوم الثالث', 'اليوم الرابع', 'اليوم الخامس'];
    const hijriMonths = ["محرم", "صفر", "ربيع الأول", "ربيع الثاني", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"];
    
    // المجموعات بالترتيب: أ -> هـ -> د -> ج -> ب
    const groupsList = [
        { name: 'المجموعة الاولى', index: 0 },
        { name: 'المجموعة الثانية', index: 4 },
        { name: 'المجموعة الثالثة', index: 3 },
        { name: 'المجموعة الرابعة', index: 2 },
        { name: 'المجموعة الخامسة', index: 1 }
    ];

    function getHijriDetails(dateObj) {
        const formatter = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { 
            day: 'numeric', 
            month: 'numeric', 
            year: 'numeric' 
        });
        const parts = formatter.formatToParts(dateObj);
        let d, m, y;
        parts.forEach(item => {
            if (item.type === 'day') d = parseInt(item.value, 10);
            if (item.type === 'month') m = parseInt(item.value, 10);
            if (item.type === 'year') y = parseInt(item.value, 10);
        });
        return { 
            day: d, 
            monthIndex: m - 1, 
            monthName: hijriMonths[m - 1] || "", 
            year: y, 
            fullStr: `${d} ${hijriMonths[m - 1] || ""} ${y} هـ` 
        };
    }

    // حساب حالة الشفت داخل الدورة (25 يوماً)
    function calculate25DayShift(cycleDay) {
        if (cycleDay < 5) {
            return { title: 'صباح 🌅', time: '6:00 ص - 2:00 ظ', sub: ordinalNames[cycleDay + 1], bgClass: 'bg-morning', icon: 'fa-sun' };
        } else if (cycleDay < 8) {
            return { title: 'راحة 🌿', time: 'أوف', sub: ordinalNames[cycleDay - 4], bgClass: 'bg-off', icon: 'fa-mug-hot' };
        } else if (cycleDay < 13) {
            return { title: 'ظهر ☀️', time: '2:00 ظ - 10:00 م', sub: ordinalNames[cycleDay - 7], bgClass: 'bg-afternoon', icon: 'fa-cloud-sun' };
        } else if (cycleDay < 16) {
            return { title: 'راحة 🌿', time: 'أوف', sub: ordinalNames[cycleDay - 12], bgClass: 'bg-off', icon: 'fa-mug-hot' };
        } else if (cycleDay < 21) {
            return { title: 'ليل 🌙', time: '10:00 م - 6:00 ص', sub: ordinalNames[cycleDay - 15], bgClass: 'bg-night', icon: 'fa-moon' };
        } else {
            return { title: 'راحة 🌿', time: 'أوف', sub: ordinalNames[cycleDay - 20], bgClass: 'bg-off', icon: 'fa-bed' };
        }
    }

    // حساب الشفت بناءً على الفهرس الحسابي للمجموعة
    function getGroupShift(dayDiff, groupIndex) {
        const groupOffset = groupIndex * 5;
        const cycleDay = ((dayDiff - groupOffset) % 25 + 25) % 25;
        return calculate25DayShift(cycleDay);
    }

    function formatDateToISO(d) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    window.onload = function() {
        const savedStartDate = localStorage.getItem('abumarzook_5group_order_a_h_d_g_b');
        const todayStr = formatDateToISO(new Date());
        document.getElementById('startDate').value = savedStartDate ? savedStartDate : todayStr;

        calculateAll();

        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('fade-out');
            document.body.classList.remove('splash-active');
            document.getElementById('mainContainer').classList.add('visible');
        }, 1000);
    };

    function saveAndCalculate() {
        const startDateInput = document.getElementById('startDate').value;
        if (startDateInput) {
            localStorage.setItem('abumarzook_5group_order_a_h_d_g_b', startDateInput);
        }
        calculateAll();
    }

    function calculateAll() {
        const startDateInput = document.getElementById('startDate').value;
        if (!startDateInput) return;

        const startParts = startDateInput.split('-');
        const startDate = new Date(startParts[0], startParts[1] - 1, startParts[2]);

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        // حساب فارق الأيام بدقة
        const diffDaysToday = Math.round((today.getTime() - startDate.getTime()) / (1000 * 60 * 60 * 24));

        // 1. تحديث بطاقات حالة اليوم المباشرة
        document.getElementById('todayDateLabel').innerText = `${daysOfWeek[today.getDay()]} (${formatDateToISO(today)} م / ${getHijriDetails(today).fullStr})`;
        const todayGrid = document.getElementById('todayStatusGrid');
        
        let todayCardsHTML = '';
        groupsList.forEach(g => {
            const shift = getGroupShift(diffDaysToday, g.index);
            todayCardsHTML += `
                <div class="status-box ${shift.bgClass}">
                    <span class="group-tag">${g.name}</span>
                    <i class="fa-solid ${shift.icon}"></i> ${shift.title}
                    <div class="sub-tag">(${shift.sub})</div>
                </div>
            `;
        });
        todayGrid.innerHTML = todayCardsHTML;

        // 2. بناء الجداول الشهريّة
        const selectedFilter = document.getElementById('groupFilter').value;
        const wrapper = document.getElementById('tablesWrapper');
        wrapper.innerHTML = '';

        const totalDays = 150; 
        let monthsMap = new Map();

        for (let i = 0; i < totalDays; i++) {
            const currentDate = new Date(startDate);
            currentDate.setDate(startDate.getDate() + i);

            const hInfo = getHijriDetails(currentDate);
            const monthKey = `${hInfo.year}-${hInfo.monthIndex}`;

            if (!monthsMap.has(monthKey)) {
                monthsMap.set(monthKey, { monthName: hInfo.monthName, year: hInfo.year, days: [] });
            }

            monthsMap.get(monthKey).days.push({ dayIndex: i, dateObj: currentDate });
        }

        const fragment = document.createDocumentFragment();

        monthsMap.forEach((monthData) => {
            const card = document.createElement('div');
            card.className = 'glass-card schedule-page-card';

            let tableHeaders = `<th>اليوم</th><th>الميلادي</th><th>الهجري</th>`;
            if (selectedFilter === 'ALL') {
                groupsList.forEach(g => tableHeaders += `<th>${g.name}</th>`);
            } else {
                const targetG = groupsList.find(g => g.index === parseInt(selectedFilter, 10));
                tableHeaders += `<th>${targetG ? targetG.name : ''}</th>`;
            }

            card.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div class="card-title" style="margin:0;"><i class="fa-solid fa-calendar"></i> جدول شهر ${monthData.monthName} ${monthData.year} هـ</div>
                    <button class="btn btn-secondary" onclick="window.print()" style="padding: 5px 12px; font-size:0.85rem;"><i class="fa-solid fa-print"></i> طباعة</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr>${tableHeaders}</tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            `;

            const tbody = card.querySelector('tbody');
            let rowsHTML = '';

            monthData.days.forEach(item => {
                const currentDate = item.dateObj;
                const dayName = daysOfWeek[currentDate.getDay()];
                const formattedDate = formatDateToISO(currentDate);
                const hijriStr = getHijriDetails(currentDate).fullStr;

                let rowHTML = `<tr><td>${dayName}</td><td>${formattedDate}</td><td style="color:#38bdf8;">${hijriStr}</td>`;

                if (selectedFilter === 'ALL') {
                    groupsList.forEach(g => {
                        const shift = getGroupShift(item.dayIndex, g.index);
                        rowHTML += `<td><span class="pill ${shift.bgClass}">${shift.title}</span></td>`;
                    });
                } else {
                    const gIndex = parseInt(selectedFilter, 10);
                    const shift = getGroupShift(item.dayIndex, gIndex);
                    rowHTML += `<td><span class="pill ${shift.bgClass}">${shift.title} (${shift.sub})</span></td>`;
                }

                rowHTML += `</tr>`;
                rowsHTML += rowHTML;
            });

            tbody.innerHTML = rowsHTML;
            fragment.appendChild(card);
        });

        wrapper.appendChild(fragment);
    }
</script>

</body>
</html>
