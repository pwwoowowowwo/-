<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشاليه الملكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #aa8c2c;
            --bg-light: #f9f9fb;
            --text-main: #2c3e50;
            --card-bg: #ffffff;
            --border-color: #e1e4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        /* نظام التوزيع الذكي المتجاوب مع شكل الشاشة (كمبيوتر، عرض، طول) */
        .dashboard-grid {
            display: grid;
            gap: 20px;
            width: 100%;
        }

        /* 1. الشاشات الكبيرة (الكمبيوتر / العرض الواسع) */
        @media (min-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 320px 1fr;
            }
        }

        /* 2. الأجهزة اللوحية والوضع الأفقي (Landscape) */
        @media (orientation: landscape) and (min-width: 768px) and (max-width: 1023px) {
            .dashboard-grid {
                grid-template-columns: 260px 1fr;
            }
        }

        /* 3. الهواتف والوضع العمودي (Portrait) */
        @media (orientation: portrait), (max-width: 767px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button.btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        button.btn:hover { background: var(--primary-dark); }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #777;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>إدارة الشاليه الملكي</h1>
            <div id="screen-status" style="font-size: 12px; color: var(--primary-dark); font-weight: 600;"></div>
        </header>

        <div class="actions-bar">
            <button class="btn" onclick="exportBackup()">تصدير النسخة الاحتياطية (.json)</button>
            <button class="btn" onclick="document.getElementById('importFile').click()">استعادة النسخة</button>
            <input type="file" id="importFile" style="display:none" onchange="importBackup(event)">
        </div>

        <div class="dashboard-grid">
            <div class="panel">
                <h3>القائمة والخيارات الجانبية</h3>
                <p style="margin-top: 10px; font-size: 14px; color: #555;">تتخذ هذه اللوحة مكانها المناسب تلقائياً حسب عرض الشاشة.</p>
            </div>
            <div class="panel">
                <h3>لوحة البيانات والتحكم الرئيسية</h3>
                <p style="margin-top: 10px; font-size: 14px; color: #555;">تتوسع المساحة هنا تلقائياً لملء شاشات الكمبيوتر أو التكيف مع الجوال.</p>
            </div>
        </div>
    </div>

    <footer>
        المطور فهد المخلفي | أخوكم أبو مرزوق
    </footer>

    <script>
        // دالة ديناميكية للتعرف على وضع الشاشة الحالي وعرضه في الهيدر كمؤشر
        function updateScreenInfo() {
            const statusDiv = document.getElementById('screen-status');
            const width = window.innerWidth;
            const isLandscape = window.matchMedia("(orientation: landscape)").matches;

            if (width >= 1024) {
                statusDiv.textContent = "💻 وضع كمبيوتر (شاشة واسعة)";
            } else if (isLandscape) {
                statusDiv.textContent = "🔄 وضع عرض (Landscape)";
            } else {
                statusDiv.textContent = "📱 وضع طول (Portrait / جوال)";
            }
        }

        window.addEventListener('resize', updateScreenInfo);
        window.addEventListener('orientationchange', updateScreenInfo);
        window.addEventListener('DOMContentLoaded', updateScreenInfo);

        // دوال الحفظ والاسترجاع للبيانات
        function exportBackup() {
            const data = { sampleKey: "بيانات الشاليه هنا", date: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'royal-chalet-backup.json';
            a.click();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    alert('تم استعادة البيانات بنجاح!');
                } catch(err) {
                    alert('ملف غير صالح!');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
