<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الشاليه الملكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: { 50: '#fdf8ec', 100: '#f9eed2', 500: '#d4af37', 600: '#b89728', 700: '#93751c', 900: '#5c4710' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .dark .glass-card { background: rgba(17, 24, 39, 0.95); border: 1px solid rgba(212, 175, 55, 0.3); }
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- شريط العنوان والتعرف التلقائي على الشاشة -->
    <header class="bg-slate-900 border-b border-royal-500/30 text-white p-4 sticky top-0 z-50 no-print shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-royal-500/20 border border-royal-500 flex items-center justify-center text-royal-500 text-xl font-bold">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">الشاليه الملكي</h1>
                    <p id="screen-status" class="text-xs text-royal-400 font-medium">جاري التعرف على وضع الشاشة...</p>
                </div>
            </div>

            <!-- أدوات التحكم والنسخ الاحتياطي -->
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <button onclick="exportData()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download text-royal-500"></i> تصدير البيانات
                </button>
                <label class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-slate-700 transition flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-upload text-royal-500"></i> استيراد
                    <input type="file" id="import-file" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 flex items-center justify-center border border-slate-700 text-royal-500">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي بتوزيع متجاوب كلياً مع الشاشات (كمبيوتر، تابلت، جوال) -->
    <main class="max-w-7xl mx-auto p-3 sm:p-6 flex-1 w-full flex flex-col gap-6">

        <!-- لوحة الإحصائيات السريعة -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
            <div class="glass-card p-4 rounded-2xl shadow-sm border-r-4 border-r-royal-500">
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">حجوزات اليوم</p>
                <h3 id="stat-today" class="text-xl sm:text-2xl font-black mt-1 text-slate-800 dark:text-white">0</h3>
            </div>
            <div class="glass-card p-4 rounded-2xl shadow-sm border-r-4 border-r-emerald-500">
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">إيرادات العربون</p>
                <h3 id="stat-revenue" class="text-xl sm:text-2xl font-black mt-1 text-emerald-600 dark:text-emerald-400">0 ر.س</h3>
            </div>
            <div class="glass-card p-4 rounded-2xl shadow-sm border-r-4 border-r-blue-500">
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">إجمالي الحجوزات</p>
                <h3 id="stat-active" class="text-xl sm:text-2xl font-black mt-1 text-slate-800 dark:text-white">0</h3>
            </div>
            <div class="glass-card p-4 rounded-2xl shadow-sm border-r-4 border-r-amber-500">
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">حالة النظام</p>
                <h3 class="text-xs sm:text-sm font-bold mt-2 text-amber-600 dark:text-amber-400 flex items-center gap-1">
                    <i class="fa-solid fa-shield-halved"></i> تخزين محلي آمن
                </h3>
            </div>
        </section>

        <!-- شبكة العمل المرنة (تتوزع عمودياً للجوال وتلقائياً جنباً إلى جنب للتابلت والكمبيوتر) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- نموذج تسجيل الحجز -->
            <div class="lg:col-span-5 glass-card p-5 rounded-2xl shadow-lg no-print">
                <h2 class="text-base font-bold text-royal-600 dark:text-royal-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-file-pen"></i> تسجيل حجز جديد
                </h2>
                <form id="booking-form" onsubmit="saveBooking(event)" class="space-y-3.5">
                    <input type="hidden" id="booking-id">
                    <div>
                        <label class="block text-xs font-semibold mb-1">اسم العميل</label>
                        <input type="text" id="client-name" required class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-royal-500">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold mb-1">رقم الجوال</label>
                            <input type="tel" id="client-phone" required class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-royal-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">تاريخ الحجز</label>
                            <input type="date" id="booking-date" required class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-royal-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold mb-1">الفترة</label>
                            <select id="booking-period" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-royal-500">
                                <option value="صباحي">صباحي</option>
                                <option value="مسائي">مسائي</option>
                                <option value="يوم كامل">يوم كامل</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">المبلغ الإجمالي (ر.س)</label>
                            <input type="number" id="booking-amount" required class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-royal-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">المبلغ المدفوع (العربون)</label>
                        <input type="number" id="booking-paid" required class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-royal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1">ملاحظات إضافية</label>
                        <textarea id="booking-notes" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-royal-500"></textarea>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-royal-600 hover:bg-royal-700 text-white font-bold py-2.5 rounded-xl text-sm transition shadow-md">حفظ الحجز</button>
                        <button type="button" onclick="resetForm()" class="px-4 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 text-slate-700 dark:text-slate-300 text-sm font-bold rounded-xl transition">إلغاء</button>
                    </div>
                </form>
            </div>

            <!-- سجل وحجوزات الشاليه -->
            <div class="lg:col-span-7 glass-card p-5 rounded-2xl shadow-lg">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                    <h2 class="text-base font-bold text-royal-600 dark:text-royal-400 flex items-center gap-2">
                        <i class="fa-solid fa-list-check"></i> سجل الحجوزات النشطة
                    </h2>
                    <input type="text" id="search-input" oninput="renderBookings()" placeholder="بحث بالاسم أو الجوال..." class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-1.5 text-xs w-full sm:w-48 focus:outline-none focus:border-royal-500">
                </div>
                
                <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800 max-h-[480px]">
                    <table class="w-full text-right text-xs">
                        <thead class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 sticky top-0">
                            <tr>
                                <th class="p-3">العميل</th>
                                <th class="p-3">التاريخ</th>
                                <th class="p-3">المبلغ</th>
                                <th class="p-3">المتبقي</th>
                                <th class="p-3 text-center no-print">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="bookings-table-body" class="divide-y divide-slate-200 dark:divide-slate-800">
                            <!-- التعبئة التلقائية للبيانات -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- نافذة الطباعة المنبثقة -->
    <div id="print-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
        <div class="glass-card w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <h3 class="text-lg font-bold text-royal-600 mb-4 text-center">سند قبض / تأكيد حجز</h3>
            <div id="print-content" class="bg-white text-slate-900 p-4 rounded-xl border border-slate-300 space-y-2 text-sm">
                <!-- تفاصيل السند -->
            </div>
            <div class="flex gap-2 mt-5">
                <button onclick="window.print()" class="flex-1 bg-royal-600 text-white font-bold py-2 rounded-xl text-sm">طباعة السند</button>
                <button onclick="closePrintModal()" class="px-4 bg-slate-300 text-slate-800 font-bold py-2 rounded-xl text-sm">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        let bookings = JSON.parse(localStorage.getItem('royal_chalet_bookings')) || [];

        // دالة التعرف الذكي على نوع الشاشة والوضع (عمودي أو أفقي)
        function updateScreenStatus() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const statusEl = document.getElementById('screen-status');
            const isLandscape = width > height;
            
            let deviceType = "كمبيوتر / شاشة عريضة";
            if (width < 768) {
                deviceType = "جوال ذكي";
            } else if (width >= 768 && width < 1024) {
                deviceType = "تابلت / جهاز لوحي";
            }

            statusEl.innerText = `${deviceType} | الوضع: ${isLandscape ? 'أفقي (Landscape)' : 'عمودي (Portrait)'} (${width}×${height}px)`;
        }

        window.addEventListener('resize', updateScreenStatus);
        window.addEventListener('orientationchange', updateScreenStatus);
        window.addEventListener('DOMContentLoaded', () => {
            updateScreenStatus();
            renderBookings();
            updateStats();
            document.getElementById('booking-date').valueAsDate = new Date();
        });

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function saveBooking(e) {
            e.preventDefault();
            const id = document.getElementById('booking-id').value;
            const booking = {
                id: id ? Number(id) : Date.now(),
                name: document.getElementById('client-name').value,
                phone: document.getElementById('client-phone').value,
                date: document.getElementById('booking-date').value,
                period: document.getElementById('booking-period').value,
                amount: Number(document.getElementById('booking-amount').value),
                paid: Number(document.getElementById('booking-paid').value),
                notes: document.getElementById('booking-notes').value
            };

            if (id) {
                const index = bookings.findIndex(b => b.id === Number(id));
                if (index !== -1) bookings[index] = booking;
            } else {
                bookings.push(booking);
            }

            localStorage.setItem('royal_chalet_bookings', JSON.stringify(bookings));
            resetForm();
            renderBookings();
            updateStats();
        }

        function renderBookings() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const tbody = document.getElementById('bookings-table-body');
            tbody.innerHTML = '';

            const filtered = bookings.filter(b => b.name.toLowerCase().includes(query) || b.phone.includes(query));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-slate-500">لا توجد حجوزات مطابقة</td></tr>`;
                return;
            }

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(b => {
                const remaining = b.amount - b.paid;
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                        <td class="p-3 font-semibold">${b.name}<br><span class="text-[10px] text-slate-400">${b.phone}</span></td>
                        <td class="p-3">${b.date}<br><span class="text-[10px] text-royal-500 font-medium">${b.period}</span></td>
                        <td class="p-3">${b.amount} ر.س</td>
                        <td class="p-3 ${remaining > 0 ? 'text-amber-600 font-bold' : 'text-emerald-600'}">${remaining} ر.س</td>
                        <td class="p-3 text-center no-print space-x-1 space-x-reverse">
                            <button onclick="printVoucher(${b.id})" class="p-1.5 bg-royal-500/10 text-royal-600 hover:bg-royal-500 hover:text-white rounded-lg transition" title="طباعة سند"><i class="fa-solid fa-print"></i></button>
                            <button onclick="editBooking(${b.id})" class="p-1.5 bg-blue-500/10 text-blue-600 hover:bg-blue-500 hover:text-white rounded-lg transition" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteBooking(${b.id})" class="p-1.5 bg-rose-500/10 text-rose-600 hover:bg-rose-500 hover:text-white rounded-lg transition" title="حذف"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateStats() {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayCount = bookings.filter(b => b.date === todayStr).length;
            const totalRev = bookings.reduce((sum, b) => sum + b.paid, 0);

            document.getElementById('stat-today').innerText = todayCount;
            document.getElementById('stat-revenue').innerText = totalRev + ' ر.س';
            document.getElementById('stat-active').innerText = bookings.length;
        }

        function editBooking(id) {
            const b = bookings.find(item => item.id === id);
            if (!b) return;
            document.getElementById('booking-id').value = b.id;
            document.getElementById('client-name').value = b.name;
            document.getElementById('client-phone').value = b.phone;
            document.getElementById('booking-date').value = b.date;
            document.getElementById('booking-period').value = b.period;
            document.getElementById('booking-amount').value = b.amount;
            document.getElementById('booking-paid').value = b.paid;
            document.getElementById('booking-notes').value = b.notes;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteBooking(id) {
            if (confirm('هل أنت متأكد من حذف هذا الحجز؟')) {
                bookings = bookings.filter(b => b.id !== id);
                localStorage.setItem('royal_chalet_bookings', JSON.stringify(bookings));
                renderBookings();
                updateStats();
            }
        }

        function resetForm() {
            document.getElementById('booking-form').reset();
            document.getElementById('booking-id').value = '';
            document.getElementById('booking-date').valueAsDate = new Date();
        }

        function printVoucher(id) {
            const b = bookings.find(item => item.id === id);
            if (!b) return;
            document.getElementById('print-content').innerHTML = `
                <p><strong>اسم العميل:</strong> ${b.name}</p>
                <p><strong>رقم الجوال:</strong> ${b.phone}</p>
                <p><strong>تاريخ الحجز:</strong> ${b.date} (${b.period})</p>
                <p><strong>الإجمالي:</strong> ${b.amount} ر.س</p>
                <p><strong>المدفوع (العربون):</strong> ${b.paid} ر.س</p>
                <p><strong>المتبقي:</strong> ${b.amount - b.paid} ر.س</p>
            `;
            document.getElementById('print-modal').classList.remove('hidden');
        }

        function closePrintModal() {
            document.getElementById('print-modal').classList.add('hidden');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bookings));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "royal_chalet_backup.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    bookings = JSON.parse(e.target.result);
                    localStorage.setItem('royal_chalet_bookings', JSON.stringify(bookings));
                    renderBookings();
                    updateStats();
                    alert('تم استيراد البيانات بنجاح');
                } catch (err) {
                    alert('ملف غير صالح');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
